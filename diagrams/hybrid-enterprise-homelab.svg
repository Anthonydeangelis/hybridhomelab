<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title description">
  <title id="title">Hybrid Identity and Security Homelab Architecture</title>
  <desc id="description">A private Proxmox homelab runs Active Directory, administration, file, web, monitoring, and isolated testing systems. Selected identities synchronize to Microsoft Entra ID, and an outbound Application Proxy connector publishes the internal web application. A separate Terraform-managed Azure workload has no private route to the homelab.</desc>

  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08111f"/>
      <stop offset="1" stop-color="#0d1a2d"/>
    </linearGradient>
    <filter id="card-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#020617" flood-opacity="0.28"/>
    </filter>
    <marker id="arrow-cyan" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#38bdf8"/>
    </marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#a78bfa"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#34d399"/>
    </marker>
    <marker id="arrow-amber" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#fbbf24"/>
    </marker>
    <style>
      text { font-family: Inter, "Segoe UI", Arial, sans-serif; }
      .title { fill: #f8fafc; font-size: 34px; font-weight: 700; letter-spacing: -0.6px; }
      .subtitle { fill: #94a3b8; font-size: 16px; font-weight: 400; }
      .zone-title { fill: #e2e8f0; font-size: 19px; font-weight: 700; }
      .section { fill: #7f93ad; font-size: 12px; font-weight: 700; letter-spacing: 1.4px; }
      .card-title { fill: #f1f5f9; font-size: 17px; font-weight: 700; }
      .card-detail { fill: #a9b8cc; font-size: 13px; font-weight: 400; }
      .card-meta { fill: #7f93ad; font-size: 12px; font-weight: 600; }
      .icon-text { fill: #eaf8ff; font-size: 12px; font-weight: 800; text-anchor: middle; }
      .edge-label { fill: #cbd5e1; font-size: 12px; font-weight: 600; }
      .legend { fill: #a9b8cc; font-size: 12px; font-weight: 500; }
      .cyan { stroke: #38bdf8; }
      .purple { stroke: #a78bfa; }
      .green { stroke: #34d399; }
      .amber { stroke: #fbbf24; }
      .flow { fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      .telemetry { fill: none; stroke: #34d399; stroke-width: 2; stroke-linecap: round; opacity: 0.72; }
    </style>
  </defs>

  <rect width="1600" height="980" fill="url(#canvas)"/>
  <circle cx="1460" cy="-40" r="330" fill="#173052" opacity="0.18"/>
  <circle cx="100" cy="980" r="340" fill="#123353" opacity="0.14"/>

  <text x="58" y="58" class="title">Hybrid Identity &amp; Security Homelab</text>
  <text x="58" y="88" class="subtitle">Private Proxmox services · Microsoft Entra integration · standalone Azure infrastructure</text>

  <g transform="translate(902 66)">
    <line x1="0" y1="0" x2="24" y2="0" class="cyan flow"/>
    <text x="34" y="4" class="legend">identity sync</text>
    <line x1="136" y1="0" x2="160" y2="0" class="purple flow"/>
    <text x="170" y="4" class="legend">app access</text>
    <line x1="266" y1="0" x2="290" y2="0" class="green flow"/>
    <text x="300" y="4" class="legend">telemetry</text>
    <line x1="390" y1="0" x2="414" y2="0" class="amber flow" stroke-dasharray="7 6"/>
    <text x="424" y="4" class="legend">test traffic</text>
  </g>

  <!-- Proxmox zone -->
  <rect x="56" y="126" width="978" height="796" rx="24" fill="#101b2d" stroke="#27364d" stroke-width="1.5"/>
  <rect x="56" y="126" width="6" height="796" rx="3" fill="#38bdf8"/>
  <text x="92" y="173" class="zone-title">Proxmox homelab</text>
  <text x="930" y="173" class="card-meta" text-anchor="end">PRIVATE NETWORK</text>

  <text x="94" y="216" class="section">IDENTITY &amp; ADMINISTRATION</text>
  <text x="94" y="418" class="section">MEMBER SERVICES &amp; APPLICATION ACCESS</text>
  <text x="94" y="620" class="section">MONITORING &amp; CONTROLLED VALIDATION</text>

  <!-- Cross-boundary flows are drawn behind the cards. -->
  <path d="M515 235 V194 H1018 V260 H1064" class="cyan flow" marker-end="url(#arrow-cyan)"/>
  <rect x="702" y="180" width="176" height="28" rx="7" fill="#132238" stroke="#24425e"/>
  <text x="790" y="199" class="edge-label" text-anchor="middle">selected OU sync</text>

  <path d="M934 502 C1005 502 1010 390 1064 390" class="purple flow" marker-end="url(#arrow-purple)"/>
  <rect x="934" y="424" width="116" height="28" rx="7" fill="#1c1b38" stroke="#43386c"/>
  <text x="992" y="443" class="edge-label" text-anchor="middle">outbound only</text>

  <!-- Wazuh telemetry bus -->
  <path d="M225 365 V600 H244 V660" class="telemetry" marker-end="url(#arrow-green)"/>
  <path d="M515 365 V600 H244" class="telemetry"/>
  <path d="M805 365 V600 H244" class="telemetry"/>
  <path d="M225 567 V600" class="telemetry"/>
  <path d="M515 567 V600" class="telemetry"/>
  <rect x="324" y="581" width="162" height="27" rx="7" fill="#102a2a" stroke="#20574d"/>
  <text x="405" y="600" class="edge-label" text-anchor="middle">endpoint events</text>

  <!-- Controlled SMB test path -->
  <path d="M558 660 C558 610 390 602 300 567" class="amber flow" stroke-dasharray="8 7" marker-end="url(#arrow-amber)"/>
  <rect x="506" y="581" width="188" height="27" rx="7" fill="#2b2414" stroke="#5e4c1d"/>
  <text x="600" y="600" class="edge-label" text-anchor="middle">failed SMB logons</text>

  <!-- Identity cards -->
  <g filter="url(#card-shadow)">
    <rect x="96" y="235" width="258" height="130" rx="14" fill="#17253a" stroke="#30445f"/>
    <rect x="96" y="235" width="4" height="130" rx="2" fill="#38bdf8"/>
    <rect x="386" y="235" width="258" height="130" rx="14" fill="#17253a" stroke="#30445f"/>
    <rect x="386" y="235" width="4" height="130" rx="2" fill="#38bdf8"/>
    <rect x="676" y="235" width="258" height="130" rx="14" fill="#17253a" stroke="#30445f"/>
    <rect x="676" y="235" width="4" height="130" rx="2" fill="#38bdf8"/>
  </g>

  <rect x="118" y="257" width="38" height="38" rx="9" fill="#075985"/><text x="137" y="281" class="icon-text">AD</text>
  <text x="172" y="275" class="card-title">DC01</text>
  <text x="172" y="295" class="card-meta">WIN-DC01</text>
  <text x="118" y="326" class="card-detail">AD DS · DNS · corp.local</text>
  <text x="118" y="347" class="card-detail">OUs, users, and AGDLP groups</text>

  <rect x="408" y="257" width="38" height="38" rx="9" fill="#075985"/><text x="427" y="281" class="icon-text">ID</text>
  <text x="462" y="275" class="card-title">SYNC01</text>
  <text x="462" y="295" class="card-meta">HYBRID IDENTITY</text>
  <text x="408" y="326" class="card-detail">Microsoft Entra Connect Sync</text>
  <text x="408" y="347" class="card-detail">LabSync OU filtering</text>

  <rect x="698" y="257" width="38" height="38" rx="9" fill="#075985"/><text x="717" y="281" class="icon-text">RS</text>
  <text x="752" y="275" class="card-title">ADMIN01</text>
  <text x="752" y="295" class="card-meta">MANAGEMENT</text>
  <text x="698" y="326" class="card-detail">Domain-joined workstation</text>
  <text x="698" y="347" class="card-detail">RSAT administration</text>

  <!-- Service cards -->
  <g filter="url(#card-shadow)">
    <rect x="96" y="437" width="258" height="130" rx="14" fill="#17253a" stroke="#30445f"/>
    <rect x="96" y="437" width="4" height="130" rx="2" fill="#64748b"/>
    <rect x="386" y="437" width="258" height="130" rx="14" fill="#17253a" stroke="#30445f"/>
    <rect x="386" y="437" width="4" height="130" rx="2" fill="#64748b"/>
    <rect x="676" y="437" width="258" height="130" rx="14" fill="#1d1b39" stroke="#443a6b"/>
    <rect x="676" y="437" width="4" height="130" rx="2" fill="#a78bfa"/>
  </g>

  <rect x="118" y="459" width="38" height="38" rx="9" fill="#334155"/><text x="137" y="483" class="icon-text">FS</text>
  <text x="172" y="477" class="card-title">FS01</text>
  <text x="172" y="497" class="card-meta">FILE SERVICES</text>
  <text x="118" y="528" class="card-detail">Department SMB shares</text>
  <text x="118" y="549" class="card-detail">AGDLP share + NTFS access</text>

  <rect x="408" y="459" width="38" height="38" rx="9" fill="#334155"/><text x="427" y="483" class="icon-text">NX</text>
  <text x="462" y="477" class="card-title">WEB01</text>
  <text x="462" y="497" class="card-meta">INTERNAL APP</text>
  <text x="408" y="528" class="card-detail">Ubuntu · Nginx</text>
  <text x="408" y="549" class="card-detail">No direct inbound exposure</text>

  <rect x="698" y="459" width="38" height="38" rx="9" fill="#5b3fa3"/><text x="717" y="483" class="icon-text">AP</text>
  <text x="752" y="477" class="card-title">Private Connector</text>
  <text x="752" y="497" class="card-meta">APPLICATION PROXY</text>
  <text x="698" y="528" class="card-detail">Reaches WEB01 internally</text>
  <text x="698" y="549" class="card-detail">Connects outward to Entra</text>

  <path d="M676 517 H644" class="purple flow" marker-end="url(#arrow-purple)"/>

  <!-- Monitoring and validation cards -->
  <g filter="url(#card-shadow)">
    <rect x="96" y="660" width="300" height="154" rx="14" fill="#132d2e" stroke="#276158"/>
    <rect x="96" y="660" width="4" height="154" rx="2" fill="#34d399"/>
    <rect x="430" y="660" width="260" height="154" rx="14" fill="#2a2418" stroke="#665322"/>
    <rect x="430" y="660" width="4" height="154" rx="2" fill="#fbbf24"/>
    <rect x="724" y="660" width="270" height="154" rx="14" fill="#17253a" stroke="#30445f"/>
  </g>

  <rect x="118" y="684" width="38" height="38" rx="9" fill="#0f766e"/><text x="137" y="708" class="icon-text">WZ</text>
  <text x="172" y="702" class="card-title">WAZUH01</text>
  <text x="172" y="722" class="card-meta">MONITORING</text>
  <text x="118" y="753" class="card-detail">Five active endpoint agents</text>
  <text x="118" y="774" class="card-detail">Five tested custom detections</text>
  <text x="118" y="795" class="card-detail">Windows + Linux telemetry</text>

  <rect x="452" y="684" width="38" height="38" rx="9" fill="#92400e"/><text x="471" y="708" class="icon-text">KL</text>
  <text x="506" y="702" class="card-title">KALI01</text>
  <text x="506" y="722" class="card-meta">TEST HOST</text>
  <text x="452" y="753" class="card-detail">Disposable AttackLab users</text>
  <text x="452" y="774" class="card-detail">Controlled SMB validation</text>
  <text x="452" y="795" class="card-detail">No route to normal LAN</text>

  <text x="750" y="698" class="section">ISOLATED TEST SEGMENT</text>
  <text x="750" y="735" class="card-title">vmbr1 · 172.30.30.0/24</text>
  <text x="750" y="764" class="card-detail">No gateway or physical uplink</text>
  <text x="750" y="787" class="card-detail">TCP 445: KALI01 → FS01 only</text>

  <!-- Microsoft Entra zone -->
  <rect x="1064" y="126" width="480" height="356" rx="24" fill="#151a34" stroke="#393761" stroke-width="1.5"/>
  <rect x="1064" y="126" width="6" height="356" rx="3" fill="#a78bfa"/>
  <text x="1100" y="173" class="zone-title">Microsoft Entra ID</text>
  <text x="1508" y="173" class="card-meta" text-anchor="end">CLOUD IDENTITY</text>

  <rect x="1100" y="207" width="408" height="104" rx="13" fill="#1d2343" stroke="#443f72"/>
  <rect x="1122" y="229" width="38" height="38" rx="9" fill="#5b3fa3"/><text x="1141" y="253" class="icon-text">ID</text>
  <text x="1176" y="247" class="card-title">Synchronized identities</text>
  <text x="1176" y="270" class="card-detail">Selected users and groups · password hash sync</text>
  <text x="1122" y="294" class="card-meta">CORP.LOCAL → ENTRA TENANT</text>

  <rect x="1100" y="331" width="408" height="115" rx="13" fill="#1d2343" stroke="#443f72"/>
  <rect x="1122" y="353" width="38" height="38" rx="9" fill="#5b3fa3"/><text x="1141" y="377" class="icon-text">MFA</text>
  <text x="1176" y="371" class="card-title">Published application</text>
  <text x="1176" y="394" class="card-detail">Assigned group · MFA Conditional Access</text>
  <text x="1122" y="423" class="card-meta">REMOTE USER → ENTRA → CONNECTOR → WEB01</text>

  <!-- Standalone Azure zone -->
  <rect x="1064" y="514" width="480" height="340" rx="24" fill="#111f32" stroke="#2b4763" stroke-width="1.5"/>
  <rect x="1064" y="514" width="6" height="340" rx="3" fill="#60a5fa"/>
  <text x="1100" y="561" class="zone-title">Azure infrastructure</text>
  <text x="1508" y="561" class="card-meta" text-anchor="end">TERRAFORM MANAGED</text>

  <rect x="1100" y="595" width="190" height="174" rx="13" fill="#17283e" stroke="#315474"/>
  <rect x="1122" y="617" width="38" height="38" rx="9" fill="#1d4ed8"/><text x="1141" y="641" class="icon-text">VM</text>
  <text x="1122" y="684" class="card-title">Public web VM</text>
  <text x="1122" y="711" class="card-detail">Ubuntu · Nginx · HTTPS</text>
  <text x="1122" y="734" class="card-detail">Managed identity</text>
  <text x="1122" y="757" class="card-detail">Protected /admin/</text>

  <rect x="1318" y="595" width="190" height="174" rx="13" fill="#17283e" stroke="#315474"/>
  <rect x="1340" y="617" width="38" height="38" rx="9" fill="#1d4ed8"/><text x="1359" y="641" class="icon-text">KV</text>
  <text x="1340" y="684" class="card-title">Data &amp; secrets</text>
  <text x="1340" y="711" class="card-detail">Azure Key Vault</text>
  <text x="1340" y="734" class="card-detail">Storage Account</text>
  <text x="1340" y="757" class="card-detail">RBAC access</text>

  <path d="M1318 700 H1290" class="cyan flow" marker-end="url(#arrow-cyan)"/>
  <text x="1304" y="689" class="card-meta" text-anchor="middle">HASH</text>
  <rect x="1100" y="791" width="408" height="38" rx="9" fill="#13283d"/>
  <text x="1304" y="816" class="card-detail" text-anchor="middle">Standalone workload · no private route to Proxmox</text>

  <!-- Architecture boundary -->
  <rect x="1064" y="878" width="480" height="44" rx="12" fill="#2b2414" stroke="#665322"/>
  <circle cx="1090" cy="900" r="6" fill="#fbbf24"/>
  <text x="1110" y="905" class="edge-label">No VPN · no Azure DC/RODC · no AD replication path</text>
</svg>
